# hemisu theme for tmux
# Based on the hemisu color palette (dark mode)

# bg:       #000000 (16)
# faint:    #111111 (233)
# subtle:   #444444 (238)
# comment:  #777777 (241)
# dimmed:   #999999 (246)
# norm:     #EEEEEE (255)
# accent1:  #9FD3E6 (116) - blue
# accent2:  #B1D631 (149) - green
# accent3:  #BBFFAA (157) - light green
# accent4:  #ECE1C8 (230) - tan
# normRed:  #D65E76 (167)

# Status bar
set -g status-style "bg=#111111,fg=#EEEEEE"
set -g status-position bottom
set -g status-interval 5

# Status left — session name
set -g status-left-length 40
set -g status-left "#[bg=#BBFFAA,fg=#000000,bold] #S #[bg=#111111,fg=#BBFFAA]"

# Status right — date and time
set -g status-right-length 80
set -g status-right "#[bg=#111111,fg=#999999] %d.%m %H:%M "

# Window tabs
setw -g window-status-format "#[bg=#111111,fg=#777777] #I:#W "
setw -g window-status-current-format "#[bg=#9FD3E6,fg=#000000,bold] #I:#W #[bg=#111111,fg=#BBFFAA] ♥ Ну хоть кто-то ♥ "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#BBFFAA"

# Messages
set -g message-style "bg=#005F87,fg=#EEEEEE"
set -g message-command-style "bg=#444444,fg=#EEEEEE"

# Mode (copy mode highlight)
setw -g mode-style "bg=#005F87,fg=#EEEEEE"

# Bell
setw -g window-status-bell-style "bg=#63001C,fg=#FFAFAF,bold"

# Clock
setw -g clock-mode-colour "#9FD3E6"
